<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قارئ النصوص</title>
  <meta property="og:image" content="https://smwknjyb5-glitch.github.io/karnas/karnas.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="صورة تطبيق  قارئ النصوص">
<style>
:root{--bg:#0d1b3a;--panel:#13264f;--line:#2a3f70;--text:#f1ece0;--muted:#a9b4cf;--gold:#e3b84d;--gold-d:#b98f26;--hl:#e3b84d33;--ok:#8fe0a8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Traditional Arabic",serif;line-height:1.7;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.6rem;margin:8px 0 4px;color:var(--gold)}
h2{font-size:1.05rem;margin:0 0 8px;color:var(--gold)}
p.sub{margin:0 0 14px;color:var(--muted);font-size:.95rem}
textarea{width:100%;min-height:200px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:1.05rem;resize:vertical}
input[type=text]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;flex:1;min-width:140px}
textarea:focus,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button.main{background:var(--gold);color:#1b1500;border-color:var(--gold-d);font-weight:700}
button.del{color:#ffb4a6}
button:active{transform:scale(.97)}
label{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:6px}
select,input[type=range]{font:inherit}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:100%}
input[type=range]{accent-color:var(--gold)}
.stats{color:var(--muted);font-size:.85rem;margin-right:auto}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
#lib{flex:1;min-width:180px}
#reader{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;font-size:1.2rem;line-height:2.1;display:none}
#reader.show{display:block}
#reader .s{cursor:pointer;border-radius:4px;padding:1px 2px}
#reader .s.active{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
#reader .s:hover{background:#ffffff14}
#bar{height:5px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#msg{color:#ffb4a6;font-size:.9rem;margin-top:8px;min-height:1.2em}
#msg.ok{color:var(--ok)}
#auto{color:var(--muted);font-size:.8rem}
canvas#cv{max-width:100%;max-height:78vh;border-radius:10px;border:1px solid var(--line);background:#0d1b3a;display:none;margin:8px auto}
video#pv2{max-width:100%;max-height:78vh;border-radius:10px;margin:8px auto;display:none;background:#000}
[hidden]{display:none!important}
#imgPrev{max-width:100%;max-height:220px;border-radius:10px;margin-top:8px;display:block}
#reader img.ri{display:block;max-width:100%;max-height:340px;margin:0 auto 14px;border-radius:10px}
@media print{body{background:#fff;color:#000}.ctrl{display:none}#reader{display:block;border:0;background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>قارئ النصوص</h1>
  <p class="sub">الصق مقالاً أو نصاً، ثم اضغط «ابدأ القراءة» ليُقرأ بصوت عالٍ مع تمييز الجملة الحالية. يُحفظ النص وموضع القراءة تلقائياً.</p>

  <div class="ctrl">
    <textarea id="src" placeholder="الصق النص هنا..."></textarea>
    <div class="row">
      <button id="paste">لصق من الحافظة</button>
      <button id="clear">مسح</button>
      <span id="auto"></span>
      <span class="stats" id="stats">0 كلمة</span>
    </div>

    <div class="box">
      <h2>النصوص المحفوظة</h2>
      <div class="row">
        <input type="text" id="title" placeholder="عنوان النص (اختياري)">
        <button class="main" id="save">حفظ النص</button>
      </div>
      <div class="row">
        <select id="lib"></select>
        <button id="load">فتح</button>
        <button class="del" id="delete">حذف</button>
      </div>
      <div class="row">
        <button id="export">تصدير كملف TXT</button>
        <button id="import">استيراد ملف TXT</button>
        <input type="file" id="file" accept=".txt,text/plain" hidden>
      </div>
    </div>

    <div class="box">
      <h2>صورة المقال</h2>
      <div class="row">
        <button id="imgBtn">إضافة صورة</button>
        <button class="del" id="imgDel" hidden>إزالة الصورة</button>
        <label>موضع الصورة
          <select id="imgPos"><option value="top">أعلى النص</option><option value="bg">خلفية شفافة (في الفيديو)</option></select>
        </label>
        <input type="file" id="imgFile" accept="image/*" hidden>
      </div>
      <img id="imgPrev" alt="" hidden>
    </div>

    <div class="box">
      <h2>فيديو القراءة</h2>
      <div class="row">
        <label>شكل الفيديو <select id="vfmt"><option value="720x1280">عمودي للهاتف وفيسبوك (9:16)</option><option value="1080x1080">مربع (1:1)</option><option value="1280x720">أفقي (16:9)</option></select></label>
        <label>الخلفية <select id="vtheme"><option value="night">ليل ذهبي</option><option value="emerald">أخضر زمردي</option><option value="sky">أزرق سماوي</option><option value="purple">بنفسجي</option><option value="sunset">غروب</option></select></label>
      </div>
      <div class="row">
        <label>حجم الخط في الفيديو <input type="range" id="vfs" min="36" max="110" step="2" value="64"> <span id="vfv">64</span></label>
      </div>
      <div class="row">
        <button class="main" id="rec">ابدأ القراءة وتسجيل الفيديو</button>
        <label>مصدر الصوت <select id="recAudio"><option value="tab">صوت النظام أو التبويب (حاسوب)</option><option value="mic">الميكروفون (هاتف أو حاسوب)</option><option value="none">بلا صوت</option></select></label>
      </div>
      <canvas id="cv" width="720" height="1280"></canvas>
      <video id="pv2" controls></video>
      <div class="row"><button class="main" id="dl" hidden>تنزيل الفيديو</button></div>
    </div>

    <div class="row">
      <label>الصوت
        <select id="voice"></select>
      </label>
    </div>
    <div class="row">
      <label>السرعة <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"> <span id="rv">1.0</span></label>
      <label>النبرة <input type="range" id="pitch" min="0.5" max="1.5" step="0.1" value="1"> <span id="pv">1.0</span></label>
      <label>الخط <input type="range" id="fs" min="16" max="36" step="1" value="20"></label>
    </div>

    <div class="row">
      <button class="main" id="play">ابدأ القراءة</button>
      <button id="pause">إيقاف مؤقت</button>
      <button id="stop">إيقاف</button>
      <button id="prev">الجملة السابقة</button>
      <button id="next">الجملة التالية</button>
    </div>
    <div id="msg"></div>
  </div>

  <div id="bar"><i></i></div>
  <div id="reader" aria-live="polite"></div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var src=$('src'), reader=$('reader'), msg=$('msg'), voiceSel=$('voice'), libSel=$('lib');
  var synth=window.speechSynthesis;
  var sentences=[], spans=[], idx=0, playing=false, paused=false, voices=[];
  var KEY_CUR='qn_current_v1', KEY_LIB='qn_library_v1';
  var savedVoice='', saveTimer=null, restoring=true;

  if(!synth){ msg.textContent='متصفحك لا يدعم القراءة الصوتية. جرّب متصفحاً آخر.'; }

  /* ---------- التخزين ---------- */
  function lsGet(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
  function note(t,ok){ msg.textContent=t; msg.className=ok?'ok':''; }

  function saveCurrent(){
    var vo=voices[voiceSel.value];
    var cur={
      text:src.value, idx:idx, title:$('title').value,
      rate:$('rate').value, pitch:$('pitch').value, fs:$('fs').value,
      voice:vo?vo.name:savedVoice, img:imgData, imgPos:$('imgPos').value,
      vfmt:$('vfmt').value, vtheme:$('vtheme').value, vfs:$('vfs').value
    };
    var okk=lsSet(KEY_CUR,cur);
    if(!okk&&cur.img){ cur.img=''; okk=lsSet(KEY_CUR,cur); }
    $('auto').textContent=okk?'✓ حُفظ تلقائياً':'تعذّر الحفظ التلقائي';
  }
  function saveSoon(){ if(restoring) return; clearTimeout(saveTimer); saveTimer=setTimeout(saveCurrent,400); }

  function getLib(){ var l=lsGet(KEY_LIB); return Array.isArray(l)?l:[]; }

  function renderLib(selectId){
    var lib=getLib(); libSel.innerHTML='';
    if(!lib.length){
      var o=document.createElement('option'); o.value=''; o.textContent='لا توجد نصوص محفوظة'; libSel.appendChild(o); return;
    }
    lib.forEach(function(it){
      var o=document.createElement('option'); o.value=it.id;
      var pct=it.total?Math.round(it.idx/it.total*100):0;
      o.textContent=it.title+' — '+it.date+(pct?' ('+pct+'%)':'');
      libSel.appendChild(o);
    });
    if(selectId) libSel.value=selectId;
  }

  /* ---------- الأصوات ---------- */
  function loadVoices(){
    voices=synth?synth.getVoices():[];
    voiceSel.innerHTML='';
    var ar=voices.filter(function(v){return /^ar/i.test(v.lang)});
    var list=ar.length?ar:voices;
    if(!ar.length && voices.length) msg.textContent='لا يوجد صوت عربي على جهازك؛ ثبّت صوتاً عربياً من إعدادات النظام (تحويل النص إلى كلام).';
    list.forEach(function(v){
      var o=document.createElement('option');
      o.value=voices.indexOf(v); o.textContent=v.name+' ('+v.lang+')';
      voiceSel.appendChild(o);
      if(savedVoice && v.name===savedVoice) voiceSel.value=o.value;
    });
  }
  if(synth){ loadVoices(); synth.onvoiceschanged=loadVoices; }
  voiceSel.onchange=saveSoon;

  /* ---------- تقسيم النص إلى جمل ---------- */
  function split(text){
    var clean=text.replace(/\r/g,'').trim();
    if(!clean) return [];
    var parts=clean.split(/(?<=[\.\!\?؟۔…\n])\s*/);
    var out=[];
    parts.forEach(function(p){
      p=p.trim(); if(!p) return;
      while(p.length>220){
        var cut=p.lastIndexOf('،',200); if(cut<80) cut=p.lastIndexOf(',',200);
        if(cut<80) cut=p.lastIndexOf(' ',200);
        if(cut<1) cut=200;
        out.push(p.slice(0,cut+1).trim()); p=p.slice(cut+1).trim();
      }
      if(p) out.push(p);
    });
    return out;
  }

  function build(){
    sentences=split(src.value);
    reader.innerHTML=''; spans=[];
    if(imgData && $('imgPos').value==='top'){ var ri=document.createElement('img'); ri.className='ri'; ri.src=imgData; ri.alt=''; reader.appendChild(ri); }
    sentences.forEach(function(s,i){
      var el=document.createElement('span');
      el.className='s'; el.textContent=s+' ';
      el.onclick=function(){ idx=i; speak(); };
      reader.appendChild(el); spans.push(el);
    });
    reader.classList.toggle('show',sentences.length>0);
    if(idx>=sentences.length) idx=0;
  }

  function updateStats(){
    var t=src.value.trim();
    var w=t?t.split(/\s+/).length:0;
    $('stats').textContent=w?(w+' كلمة · وقت القراءة التقريبي '+Math.max(1,Math.round(w/150))+' د'):'0 كلمة';
  }

  /* ---------- القراءة ---------- */
  function mark(scroll){
    spans.forEach(function(s,i){ s.classList.toggle('active',i===idx); });
    if(scroll!==false && spans[idx]) spans[idx].scrollIntoView({block:'center',behavior:'smooth'});
    document.querySelector('#bar i').style.width=(sentences.length?((idx)/sentences.length*100):0)+'%';
    saveSoon();
  }

  function speak(){
    if(!synth||!sentences.length) return;
    synth.cancel();
    if(idx>=sentences.length){ finish(); return; }
    var u=new SpeechSynthesisUtterance(sentences[idx]);
    var v=voices[voiceSel.value]; if(v){u.voice=v; u.lang=v.lang;} else u.lang='ar-SA';
    u.rate=parseFloat($('rate').value); u.pitch=parseFloat($('pitch').value);
    var myIdx=idx;
    u.onend=function(){ if(playing && !paused && myIdx===idx){ idx++; speak(); } };
    u.onerror=function(e){ if(e.error==='interrupted'||e.error==='canceled') return; msg.textContent='تعذّرت القراءة: '+e.error; playing=false; };
    playing=true; paused=false; mark();
    synth.speak(u);
    $('pause').textContent='إيقاف مؤقت';
  }

  function finish(){ if(rec.on){ rec.done=true; setTimeout(stopRec,1200); } playing=false; paused=false; idx=0; spans.forEach(function(s){s.classList.remove('active')}); document.querySelector('#bar i').style.width='100%'; saveSoon(); }

  $('play').onclick=function(){
    msg.textContent='';
    if(!sentences.length||reader.dataset.src!==src.value){ idx=0; build(); reader.dataset.src=src.value; }
    speak();
  };
  $('pause').onclick=function(){
    if(!synth||!playing) return;
    if(paused){ synth.resume(); paused=false; this.textContent='إيقاف مؤقت'; }
    else{ synth.pause(); paused=true; this.textContent='متابعة'; }
  };
  $('stop').onclick=function(){ if(rec.on) stopRec(); if(synth) synth.cancel(); playing=false; paused=false; idx=0; mark(false); document.querySelector('#bar i').style.width='0'; $('pause').textContent='إيقاف مؤقت'; };
  $('next').onclick=function(){ if(!sentences.length) return; idx=Math.min(idx+1,sentences.length-1); speak(); };
  $('prev').onclick=function(){ if(!sentences.length) return; idx=Math.max(idx-1,0); speak(); };

  /* ---------- إعدادات ---------- */
  $('rate').oninput=function(){ $('rv').textContent=parseFloat(this.value).toFixed(1); saveSoon(); };
  $('pitch').oninput=function(){ $('pv').textContent=parseFloat(this.value).toFixed(1); saveSoon(); };
  $('fs').oninput=function(){ reader.style.fontSize=this.value+'px'; saveSoon(); };
  $('title').oninput=saveSoon;
  $('vfs').oninput=function(){ $('vfv').textContent=this.value; saveSoon(); };
  $('vtheme').onchange=saveSoon;
  $('vfmt').onchange=function(){
    var d={'720x1280':64,'1080x1080':58,'1280x720':50}[this.value]||60;
    $('vfs').value=d; $('vfv').textContent=d; saveSoon();
  };
  reader.style.fontSize='20px';

  src.addEventListener('input',function(){
    updateStats();
    if(synth) synth.cancel(); playing=false; paused=false; idx=0;
    build(); reader.dataset.src=src.value;
    saveSoon();
  });

  $('clear').onclick=function(){
    if(synth) synth.cancel();
    src.value=''; $('title').value=''; playing=false; idx=0; build(); updateStats();
    document.querySelector('#bar i').style.width='0';
    saveCurrent();
  };
  $('paste').onclick=function(){
    if(navigator.clipboard&&navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(t){ src.value=t; src.dispatchEvent(new Event('input')); }).catch(function(){ msg.textContent='تعذّر الوصول إلى الحافظة؛ الصق النص يدوياً في المربع.'; });
    } else msg.textContent='الصق النص يدوياً في المربع.';
  };

  /* ---------- مكتبة النصوص المحفوظة ---------- */
  function today(){ var d=new Date(); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }

  $('save').onclick=function(){
    var text=src.value.trim();
    if(!text){ note('اكتب نصاً أولاً قبل الحفظ.'); return; }
    var title=$('title').value.trim()||text.replace(/\s+/g,' ').slice(0,30);
    $('title').value=title;
    var lib=getLib(), found=null;
    lib.forEach(function(it){ if(it.title===title) found=it; });
    if(!sentences.length) build();
    var item=found||{id:String(Date.now())};
    item.title=title; item.text=src.value; item.idx=idx; item.total=sentences.length; item.date=today(); item.img=imgData; item.imgPos=$('imgPos').value;
    if(!found) lib.unshift(item);
    var okLib=lsSet(KEY_LIB,lib); if(!okLib&&item.img){ item.img=''; okLib=lsSet(KEY_LIB,lib); }
    if(okLib){ renderLib(item.id); note(found?'تم تحديث النص المحفوظ.':'تم حفظ النص في القائمة.',true); saveCurrent(); }
    else note('تعذّر الحفظ: مساحة التخزين ممتلئة أو غير متاحة.');
  };

  $('load').onclick=function(){
    var id=libSel.value; if(!id) return;
    var it=getLib().filter(function(x){return x.id===id})[0]; if(!it) return;
    if(synth) synth.cancel(); playing=false; paused=false;
    src.value=it.text; $('title').value=it.title; idx=it.idx||0;
    $('imgPos').value=it.imgPos||'top'; setImage(it.img||'');
    updateStats(); build(); reader.dataset.src=src.value; mark(true);
    saveCurrent();
    note('تم فتح «'+it.title+'». اضغط «ابدأ القراءة» للمتابعة من آخر موضع.',true);
  };

  $('delete').onclick=function(){
    var id=libSel.value; if(!id) return;
    var lib=getLib().filter(function(x){return x.id!==id});
    lsSet(KEY_LIB,lib); renderLib(); note('تم حذف النص من القائمة.',true);
  };

  $('export').onclick=function(){
    if(!src.value.trim()){ note('لا يوجد نص لتصديره.'); return; }
    var name=($('title').value.trim()||'نص')+'.txt';
    var blob=new Blob(['\ufeff'+src.value],{type:'text/plain;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  };

  $('import').onclick=function(){ $('file').click(); };
  $('file').onchange=function(){
    var f=this.files&&this.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      src.value=String(r.result).replace(/^\ufeff/,'');
      $('title').value=f.name.replace(/\.txt$/i,'');
      src.dispatchEvent(new Event('input'));
      note('تم استيراد الملف.',true);
    };
    r.onerror=function(){ note('تعذّرت قراءة الملف.'); };
    r.readAsText(f,'utf-8'); this.value='';
  };

  /* ---------- صورة المقال ---------- */
  var imgData='', imgEl=null;
  function setImage(data){
    imgData=data||''; imgEl=null;
    var pv=$('imgPrev');
    if(imgData){
      pv.src=imgData; pv.hidden=false; $('imgDel').hidden=false;
      var im=new Image();
      im.onload=function(){ imgEl=im; refreshImg(); };
      im.src=imgData;
    } else { pv.removeAttribute('src'); pv.hidden=true; $('imgDel').hidden=true; refreshImg(); }
  }
  function refreshImg(){ if(src.value.trim()){ build(); mark(false); } saveSoon(); }
  $('imgBtn').onclick=function(){ $('imgFile').click(); };
  $('imgDel').onclick=function(){ setImage(''); };
  $('imgPos').onchange=refreshImg;
  $('imgFile').onchange=function(){
    var f=this.files&&this.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var k=Math.min(1,1280/Math.max(im.width,im.height));
        var c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
        var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
        setImage(c.toDataURL('image/jpeg',0.85));
      };
      im.onerror=function(){ note('تعذّر فتح الصورة.'); };
      im.src=r.result;
    };
    r.readAsDataURL(f); this.value='';
  };

  /* ---------- تسجيل الفيديو ---------- */
  var rec={on:false,done:false,rec:null,chunks:[],stream:null,disp:null,raf:0,lines:[],sp:0,scroll:0,url:'',mime:'',parts:[]};
  var cv=$('cv'), cx=cv.getContext('2d');
  var FONT='"Segoe UI",Tahoma,"Noto Naskh Arabic","Traditional Arabic",serif';
  var FS=64, LH=122, PAD=50, TOP=130;
  var THEMES={
    night:{c:['#0b1d4a','#1f3a86','#0a1533'],a:'#e3b84d'},
    emerald:{c:['#03281f','#0d6b52','#021a15'],a:'#f2d675'},
    sky:{c:['#08304f','#1b8cc4','#082338'],a:'#ffe27a'},
    purple:{c:['#1a0f3d','#5a2d9c','#1c0a35'],a:'#ffd166'},
    sunset:{c:['#2b0b2e','#b53a4e','#f08a3c'],a:'#ffd98a'}
  };

  function layout(){
    var f=$('vfmt').value.split('x'); cv.width=+f[0]; cv.height=+f[1];
    var m=Math.min(cv.width,cv.height);
    FS=+$('vfs').value; LH=Math.round(FS*1.9); PAD=Math.round(cv.width*0.07); TOP=Math.round(m*0.16);
    cx.font=FS+'px '+FONT; cx.direction='rtl';
    var maxW=cv.width-PAD*2-30, sp=cx.measureText(' ').width, lines=[], line=[], used=0;
    sentences.forEach(function(s,si){
      s.split(/\s+/).forEach(function(w){
        if(!w) return;
        var ww=cx.measureText(w).width;
        if(line.length && used+sp+ww>maxW){ lines.push(line); line=[]; used=0; }
        used+=(line.length?sp:0)+ww;
        line.push({w:w,s:si,ww:ww});
      });
    });
    if(line.length) lines.push(line);
    rec.lines=lines; rec.sp=sp;
    rec.imgOff=0; rec.dw=0; rec.dh=0;
    if(imgEl && $('imgPos').value==='top'){
      var k=Math.min(maxW/imgEl.width,(cv.height*0.3)/imgEl.height);
      rec.dw=imgEl.width*k; rec.dh=imgEl.height*k; rec.imgOff=rec.dh+30;
    }
    rec.parts=[];
    for(var i=0;i<46;i++) rec.parts.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:3+Math.random()*(m*0.018),v:6+Math.random()*22,ph:Math.random()*6.28,al:.08+Math.random()*.2});
  }

  function star(x,y,r,rot){
    cx.beginPath();
    for(var i=0;i<16;i++){
      var a=rot+i*Math.PI/8, rr=i%2?r*.62:r;
      cx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr);
    }
    cx.closePath();
  }

  function rrect(x,y,w,h,r){
    cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath();
  }

  function background(t,th){
    var W=cv.width,H=cv.height,m=Math.min(W,H),i;
    var g=cx.createLinearGradient(0,0,W*.4,H); g.addColorStop(0,th.c[0]); g.addColorStop(.55,th.c[1]); g.addColorStop(1,th.c[2]);
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
    /* توهج متحرك */
    for(i=0;i<2;i++){
      var gx=W*(.5+.4*Math.sin(t*.25+i*3)), gy=H*(.5+.38*Math.cos(t*.2+i*2));
      var rg=cx.createRadialGradient(gx,gy,0,gx,gy,m*.7);
      rg.addColorStop(0,th.a+'44'); rg.addColorStop(1,th.a+'00');
      cx.fillStyle=rg; cx.fillRect(0,0,W,H);
    }
    if(imgEl && $('imgPos').value==='bg'){
      var kk=Math.max(W/imgEl.width,H/imgEl.height), bw=imgEl.width*kk, bh=imgEl.height*kk;
      cx.globalAlpha=.25; cx.drawImage(imgEl,(W-bw)/2,(H-bh)/2,bw,bh); cx.globalAlpha=1;
    }
    /* نجمة زخرفية دوّارة */
    cx.strokeStyle=th.a; cx.lineWidth=3; cx.globalAlpha=.12;
    star(W/2,H/2,m*.62,t*.08); cx.stroke();
    star(W/2,H/2,m*.45,-t*.1); cx.stroke();
    cx.globalAlpha=1;
    /* جسيمات متصاعدة */
    for(i=0;i<rec.parts.length;i++){
      var p=rec.parts[i], y=((p.y-t*p.v)%H+H)%H, x=p.x+Math.sin(t*.6+p.ph)*18;
      cx.globalAlpha=p.al*(.6+.4*Math.sin(t+p.ph)); cx.fillStyle=i%3?'#ffffff':th.a;
      cx.beginPath(); cx.arc(x,y,p.r,0,6.283); cx.fill();
    }
    cx.globalAlpha=1;
    /* إطار ذهبي */
    cx.strokeStyle=th.a; cx.lineWidth=4; cx.globalAlpha=.7; rrect(14,14,W-28,H-28,26); cx.stroke();
    cx.lineWidth=1.5; cx.globalAlpha=.4; rrect(26,26,W-52,H-52,20); cx.stroke(); cx.globalAlpha=1;
  }

  function draw(){
    if(!rec.on) return;
    var cur=rec.done?-1:idx, i, W=cv.width, H=cv.height, t=performance.now()/1000;
    var th=THEMES[$('vtheme').value]||THEMES.night;
    background(t,th);
    var cardX=PAD*.55, cardY=TOP, cardW=W-PAD*1.1, cardH=H-TOP-PAD*.8;
    cx.fillStyle='rgba(6,12,32,.55)'; rrect(cardX,cardY,cardW,cardH,28); cx.fill();
    cx.strokeStyle=th.a; cx.globalAlpha=.35; cx.lineWidth=2; rrect(cardX,cardY,cardW,cardH,28); cx.stroke(); cx.globalAlpha=1;

    cx.font=FS+'px '+FONT; cx.direction='rtl'; cx.textAlign='left'; cx.textBaseline='middle';
    var viewTop=cardY+24;
    if(cur>=0){
      for(i=0;i<rec.lines.length;i++){
        if(rec.lines[i].some(function(q){return q.s===cur})){
          var tg=Math.max(0,(rec.imgOff||0)+i*LH-cardH*.32);
          rec.scroll+=(tg-rec.scroll)*0.1; break;
        }
      }
    }
    cx.save(); rrect(cardX,cardY+4,cardW,cardH-8,26); cx.clip();
    if(imgEl && rec.dh){ cx.drawImage(imgEl,(W-rec.dw)/2,viewTop-rec.scroll,rec.dw,rec.dh); }
    var textRight=W-PAD-12;
    for(i=0;i<rec.lines.length;i++){
      var y=viewTop+(rec.imgOff||0)+i*LH+LH/2-rec.scroll;
      if(y<cardY-LH||y>H+LH) continue;
      var x=textRight, ln=rec.lines[i];
      for(var j=0;j<ln.length;j++){
        var q=ln[j]; x-=q.ww;
        if(q.s===cur){ cx.fillStyle=th.a+'66'; rrect(x-8,y-LH/2+10,q.ww+16+rec.sp,LH-20,14); cx.fill(); }
        cx.fillStyle=q.s===cur?'#ffffff':(cur>=0?'#e4e1d6':'#f1ece0');
        cx.fillText(q.w,x,y);
        x-=rec.sp;
      }
    }
    cx.restore();
    /* العنوان وشريط التقدم */
    var tf=Math.round(TOP*.34);
    cx.fillStyle=th.a; cx.font='bold '+tf+'px '+FONT; cx.textAlign='center'; cx.direction='rtl';
    var ti=$('title').value.trim()||'قارئ النصوص'; while(cx.measureText(ti).width>W-PAD*2 && ti.length>4) ti=ti.slice(0,-2);
    cx.fillText(ti,W/2,TOP*.42);
    var bx=PAD, bw2=W-PAD*2, by=TOP*.76, pr=rec.done?1:(sentences.length?idx/sentences.length:0);
    cx.fillStyle='rgba(255,255,255,.18)'; rrect(bx,by,bw2,8,4); cx.fill();
    cx.fillStyle=th.a; if(pr>0){ rrect(bx+bw2*(1-pr),by,bw2*pr,8,4); cx.fill(); }
  }

  function pickMime(){
    var c=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
    for(var i=0;i<c.length;i++){ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }
    return '';
  }

  function cleanup(){
    if(rec.disp) rec.disp.getTracks().forEach(function(t){t.stop()});
    if(rec.mic) rec.mic.getTracks().forEach(function(t){t.stop()});
    rec.mic=null;
    if(rec.stream) rec.stream.getTracks().forEach(function(t){t.stop()});
    rec.disp=null; rec.stream=null;
    $('rec').textContent='ابدأ القراءة وتسجيل الفيديو';
  }

  async function startRec(){
    if(rec.on) return;
    if(!window.MediaRecorder||!cv.captureStream){ note('متصفحك لا يدعم تسجيل الفيديو. جرّب Chrome أو Edge.'); return; }
    if(!src.value.trim()){ note('اكتب نصاً أولاً.'); return; }
    if(synth) synth.cancel(); playing=false; paused=false;
    idx=0; build(); reader.dataset.src=src.value;
    var tracks=[];
    var mode=$('recAudio').value;
    if(mode==='tab'){
      if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){
        note('صوت التبويب غير مدعوم هنا (يعمل على Chrome/Edge بالحاسوب). اختر «الميكروفون» بدلاً منه.'); return;
      }
      try{
        rec.disp=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true,systemAudio:'include'});
      }catch(e){ note('أُلغيت المشاركة. أعد المحاولة، أو اختر «الميكروفون».'); return; }
      tracks=rec.disp.getAudioTracks();
      if(!tracks.length){
        cleanup();
        note('لم يصل صوت: في نافذة المشاركة اختر «الشاشة بأكملها» وفعّل «مشاركة صوت النظام» (ويندوز)، أو اختر «علامة تبويب» وفعّل «مشاركة صوت التبويب». ويمكنك اختيار «الميكروفون» بدلاً من ذلك.');
        return;
      }
    } else if(mode==='mic'){
      try{
        rec.mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      }catch(e){ note('تعذّر الوصول إلى الميكروفون. اسمح للصفحة باستخدامه ثم أعد المحاولة.'); return; }
      tracks=rec.mic.getAudioTracks();
    }
    layout(); rec.scroll=0; rec.done=false; rec.chunks=[];
    rec.stream=new MediaStream(cv.captureStream(30).getVideoTracks().concat(tracks));
    rec.mime=pickMime();
    var opt={videoBitsPerSecond:4000000}; if(rec.mime) opt.mimeType=rec.mime;
    try{ rec.rec=new MediaRecorder(rec.stream,opt); }
    catch(e){ note('تعذّر بدء التسجيل.'); cleanup(); return; }
    rec.rec.ondataavailable=function(e){ if(e.data&&e.data.size) rec.chunks.push(e.data); };
    rec.rec.onstop=onRecStop;
    rec.on=true; cv.style.display='block'; $('pv2').style.display='none'; $('dl').hidden=true;
    $('rec').textContent='إيقاف التسجيل';
    rec.rec.start(500);
    (function loop(){ if(!rec.on) return; draw(); rec.raf=requestAnimationFrame(loop); })();
    note(mode==='mic'?'جارٍ التسجيل بالميكروفون: ارفع صوت الجهاز وتجنّب السماعات الأذنية، وابقَ في مكان هادئ.':'جارٍ التسجيل... لا تغلق الصفحة حتى تنتهي القراءة.',true);
    speak();
  }

  function stopRec(){
    if(!rec.on) return;
    rec.on=false; cancelAnimationFrame(rec.raf);
    try{ rec.rec.stop(); }catch(e){ cleanup(); }
  }

  function onRecStop(){
    cleanup(); cv.style.display='none';
    if(!rec.chunks.length){ note('لم يُسجَّل أي شيء.'); return; }
    var blob=new Blob(rec.chunks,{type:rec.mime||'video/webm'});
    if(rec.url) URL.revokeObjectURL(rec.url);
    rec.url=URL.createObjectURL(blob);
    var v=$('pv2'); v.src=rec.url; v.style.display='block'; $('dl').hidden=false;
    note('اكتمل الفيديو. عاينه ثم اضغط «تنزيل الفيديو» لحفظه.',true);
  }

  if(!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia)) $('recAudio').value='mic';
  $('rec').onclick=function(){
    if(rec.on){ stopRec(); if(synth) synth.cancel(); playing=false; paused=false; }
    else startRec();
  };
  $('dl').onclick=function(){
    if(!rec.url) return;
    var a=document.createElement('a'); a.href=rec.url;
    a.download=($('title').value.trim()||'قراءة')+'.'+(/mp4/.test(rec.mime)?'mp4':'webm');
    document.body.appendChild(a); a.click(); a.remove();
  };

  /* ---------- استرجاع آخر جلسة ---------- */
  function restore(){
    var c=lsGet(KEY_CUR);
    if(c){
      if(c.rate){ $('rate').value=c.rate; $('rv').textContent=parseFloat(c.rate).toFixed(1); }
      if(c.pitch){ $('pitch').value=c.pitch; $('pv').textContent=parseFloat(c.pitch).toFixed(1); }
      if(c.fs){ $('fs').value=c.fs; reader.style.fontSize=c.fs+'px'; }
      if(c.vfmt) $('vfmt').value=c.vfmt;
      if(c.vtheme) $('vtheme').value=c.vtheme;
      if(c.vfs){ $('vfs').value=c.vfs; $('vfv').textContent=c.vfs; }
      savedVoice=c.voice||'';
      if(savedVoice) loadVoices();
      $('title').value=c.title||'';
      $('imgPos').value=c.imgPos||'top'; if(c.img) setImage(c.img);
      if(c.text){
        src.value=c.text; idx=c.idx||0;
        updateStats(); build(); reader.dataset.src=src.value; mark(false);
        note('تم استرجاع آخر نص وموضع القراءة. اضغط «ابدأ القراءة» للمتابعة.',true);
      }
    }
    renderLib();
    restoring=false;
  }
  restore();

  window.addEventListener('beforeunload',function(){ if(synth) synth.cancel(); saveCurrent(); });
})();
</script>
</body>
